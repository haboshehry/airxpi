name: build-image

# Builds the flashable AirXPi image (Raspberry Pi 3B, arm64 Bookworm).
# Artifacts are kept for 30 days; tagged builds publish a release.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Upload the image as a release asset"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  image:
    name: pi-gen image
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static rsync
          sudo docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Build image
        run: sudo -E ./image/build-in-docker.sh

      - name: List artefacts
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: airxpi-image
          path: |
            dist/*.zip
            dist/*.img.xz
          retention-days: 30
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.img.xz
          generate_release_notes: true
